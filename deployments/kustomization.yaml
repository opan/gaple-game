apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml
- service.yaml
- ingress.yaml

namespace: default  # update with your namespace

commonLabels:
  app: gaple-server
  managed-by: kustomize

images:
- name: YOUR_DOCKERHUB_USERNAME/gaple-server
  newTag: latest  # pin to a specific SHA tag for production
